# Unity no CI (frente ta-unity-ci, plano de aceleração de 05/11): EditMode, build Windows + autoplay e build Android dev em todo PR que
# mexe em client/, para a frente ver o próprio erro antes do merge. São os mesmos portões do client/tools/verify.sh full e android.
#
# Plano B do plano: runner self-hosted no PC do Vinicius (rótulo "unity-ta"), com o Unity 6000.3.27f1 já ativado lá. O GameCI no runner
# do GitHub não serve: a licença Personal do Unity 6 ativa pela conta e não gera mais o Unity_lic.ulf que ele pede (05/11).
# No PC as malhas do Tripo (client/Assets/_TA/ArtLocal/) não estão no checkout do runner, então o jogo roda com as primitivas;
# medidas e fotos com malha (diag_caixas, K3, folha de fotos) continuam na rodada local.
#
# Segurança (repositório público): só roda código deste repositório, nunca de fork. O verify.sh aborta se houver Unity aberto neste
# checkout ou emulador, Blender ou Docker ligado (um processo pesado por vez, PC de 7,7 GB); um job do Unity por vez (concurrency).
# Sem runner ligado, os jobs ficam na fila: ligue o serviço do runner fora do horário das frentes.
name: unity
on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/unity.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/unity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unity-pc   # o PC aguenta um Unity por vez; o mais novo de cada ref espera o anterior
  cancel-in-progress: false

jobs:
  unity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, unity-ta]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash   # Git Bash, o mesmo do verify.sh
    env:
      UNITY_TIMEOUT: '3000'   # teto por chamada do Unity (s)
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false   # mantém client/Library entre as rodadas (é o cache: o git clean -x apagaria)
      - name: EditMode, build Windows e autoplay (verify.sh full)
        run: client/tools/verify.sh full
      - name: Build Android dev e checa_apk (verify.sh android)
        run: client/tools/verify.sh android
      - name: Resumo
        if: always()
        run: |
          f=client/Builds/verify/editmode.xml
          [ -f "$f" ] && grep -m1 -o '<test-run [^>]*>' "$f" | grep -oE '(result|total|passed|failed)="[^"]*"' | paste -sd' ' >> "$GITHUB_STEP_SUMMARY" || true
          cat client/Builds/build_*.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-logs
          path: |
            client/Builds/verify
            client/Builds/build_*.txt
          retention-days: 14
          if-no-files-found: ignore
