# Unity no CI com GameCI (frente ta-unity-ci, plano de aceleração de 05/11): EditMode e os builds StandaloneWindows64 e Android dev em todo PR
# que mexe em client/, para a frente ver o próprio erro antes do merge. Roda com as primitivas: as malhas do Tripo ficam fora do git
# (client/Assets/_TA/ArtLocal/, licença) e o repositório é público, então medidas e fotos com malha (diag_caixas, K3, folha de fotos)
# continuam na rodada local. O autoplay do .exe também fica no PC: o runner é Linux.
#
# Segredos (Settings > Secrets and variables > Actions; só o Vinicius põe): UNITY_LICENSE (o conteúdo inteiro do Unity_lic.ulf),
# UNITY_EMAIL e UNITY_PASSWORD. Sem eles (antes de pôr, ou num PR de fork) os jobs do Unity são pulados com um aviso, não ficam vermelhos.
name: unity
on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/unity.yml'
  push:
    branches: [main]   # a main guarda a Library no cache que todos os PRs leem (cache de PR só vale para o próprio PR)
    paths:
      - 'client/**'
      - '.github/workflows/unity.yml'
  workflow_dispatch:
permissions:
  contents: read
  checks: write   # o test-runner publica o resultado do EditMode como check
concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true
env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  licenca:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.v.outputs.ok }}
    steps:
      - id: v
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then echo ok=true >> "$GITHUB_OUTPUT"
          else echo "::warning ::Faltam os segredos UNITY_LICENSE, UNITY_EMAIL ou UNITY_PASSWORD: EditMode e builds do Unity pulados."; echo ok=false >> "$GITHUB_OUTPUT"; fi

  editmode:
    needs: licenca
    if: needs.licenca.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: client/Library
          key: Library-editmode-${{ hashFiles('client/Packages/**', 'client/ProjectSettings/**') }}-${{ hashFiles('client/Assets/**') }}
          restore-keys: Library-editmode-${{ hashFiles('client/Packages/**', 'client/ProjectSettings/**') }}-
      - uses: game-ci/unity-test-runner@v4
        id: testes
        with:
          projectPath: client
          unityVersion: 6000.3.27f1
          testMode: editmode
          artifactsPath: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode (resultado)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editmode-logs
          path: |
            editmode
            client/Logs
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: licenca
    if: needs.licenca.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - alvo: StandaloneWindows64
            metodo: TA.EditorTools.Setup.BuildWindows
          - alvo: Android
            metodo: TA.EditorTools.Setup.BuildAndroidDev
    name: build (${{ matrix.alvo }})
    steps:
      # a imagem Android do GameCI tem ~8 GB comprimida e o disco livre do runner é curto: tira o que este job não usa
      - name: Libera disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: client/Library
          key: Library-${{ matrix.alvo }}-${{ hashFiles('client/Packages/**', 'client/ProjectSettings/**') }}-${{ hashFiles('client/Assets/**') }}
          restore-keys: Library-${{ matrix.alvo }}-${{ hashFiles('client/Packages/**', 'client/ProjectSettings/**') }}-
      # o mesmo método do verify.sh full/android (Setup.Apply + BuildPlayer, APK de dev com a chave de debug e sem AD_ID);
      # ele mesmo sai com 0 ou 1 e grava client/Builds/build_<alvo>.txt
      - uses: game-ci/unity-builder@v4
        with:
          projectPath: client
          unityVersion: 6000.3.27f1
          targetPlatform: ${{ matrix.alvo }}
          buildMethod: ${{ matrix.metodo }}
          versioning: None
          allowDirtyBuild: true   # o Setup.Apply regrava ProjectSettings antes do build
      - name: Confere o resumo do build
        run: |
          cat client/Builds/build_${{ matrix.alvo }}.txt
          grep -q 'result=Succeeded' client/Builds/build_${{ matrix.alvo }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-${{ matrix.alvo }}-logs
          path: |
            client/Builds/build_*.txt
            client/Logs
          retention-days: 14
          if-no-files-found: ignore
