# Portões de balanceamento (TA-1, TA-2 e GDD §5.13): os testes [Explicit] de BalanceTests, 200 sementes, ~2 min. Rodam no runner grátis do
# repositório público, sem Unity e sem segredo, em todo PR que mexe no núcleo; à mão pela aba Actions (ou gh workflow run balanco).
name: balanco
on:
  pull_request:
    paths:
      - 'client/Assets/_TA/Scripts/Core/**'
      - 'client/Assets/_TA/Tests/EditMode/**'
      - 'client/tools/coretests/**'
      - '.github/workflows/balanco.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portoes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Portões do bot
        run: |
          set -o pipefail
          dotnet test client/tools/coretests -nologo --filter "FullyQualifiedName~BalanceTests.Portao" --logger "console;verbosity=normal" | tee portoes.log
          grep -q 'Passed!' portoes.log   # filtro que nao casa teste nenhum sai 0: sem isto o job ficaria verde sem portao
      - name: Tabela no resumo
        if: always()
        run: grep -E '^\s*(\||ganho|so )' portoes.log | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY" || true
